name: Backtest

on:
  workflow_dispatch: {}   # run manually from the Actions tab

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run backtest
        run: |
          python run_backtest.py | tee backtest_log.txt
          cat backtest/results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "credit-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase
          git add backtest/results/
          git diff --cached --quiet || git commit -m "Backtest results $(date -u +%F)"
          git push
