name: Backtest

on:
  workflow_dispatch: {}   # run manually from the Actions tab

permissions:
  contents: write

concurrency:              # shares the queue with the daily monitor
  group: credit-monitor
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run backtest
        run: |
          python run_backtest.py | tee "$RUNNER_TEMP/backtest_log.txt"
          cat backtest/results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "credit-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/results/
          git diff --cached --quiet && exit 0
          git commit -m "Backtest results $(date -u +%F)"
          for i in 1 2 3; do
            # bring in anything pushed meanwhile; this run's results win
            git pull --rebase -X theirs && git push && exit 0
            sleep 10
          done
          exit 1
